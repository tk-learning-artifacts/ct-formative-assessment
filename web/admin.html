<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CT Quest for teachers</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="visuals/visuals.css" />
  <link rel="stylesheet" href="bank-controls.css" />
</head>
<body>
  <header class="bar">
    <div class="bar__inner">
      <h1 class="bar__title">CT Quest <span class="bar__context">for teachers</span></h1>
      <a class="bar__link" href="/">Student page</a>
    </div>
  </header>
  <div class="load-bar" aria-hidden="true"></div>

  <main class="wrap wrap--wide">
    <section id="screen" class="screen">
      <!-- Shown until admin.js renders; keep in step with skeletonDashboardHtml() there. -->
      <div class="dash">
        <nav class="dash__side" aria-label="Events">
          <div class="sk-side card card--flush" role="status">
            <span class="visually-hidden-b">Loading&hellip;</span>
            <div class="skeleton-b sk-row"></div><div class="skeleton-b sk-row"></div><div class="skeleton-b sk-row"></div><div class="skeleton-b sk-row"></div><div class="skeleton-b sk-row"></div>
          </div>
        </nav>
        <div class="dash__main">
          <div class="sk-main">
            <div class="skeleton-b sk-head"></div>
            <div class="skeleton-b sk-subhead"></div>
            <div class="sk-attempts"><div class="skeleton-b sk-row"></div><div class="skeleton-b sk-row"></div><div class="skeleton-b sk-row"></div><div class="skeleton-b sk-row"></div></div>
            <div class="skeleton-b sk-chart"></div>
            <div class="skeleton-b sk-chart"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="type-registry.js"></script>
  <script src="visuals/visuals.js"></script>
  <script src="question-view.js"></script>
  <script src="admin.js"></script>
  <script src="bank-controls.js"></script>
</body>
</html>
