services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - db_data:/app/backend/data
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # Only used to create the first teacher in an empty database; production
      # refuses to start without it, or with the demo password.
      SEED_TEACHER_EMAIL: ${SEED_TEACHER_EMAIL:-teacher@ctquest.local}
      SEED_TEACHER_PASSWORD: ${SEED_TEACHER_PASSWORD:-}
      SUBMIT_GRACE_SECONDS: ${SUBMIT_GRACE_SECONDS:-60}
      AI_PROVIDER: ${AI_PROVIDER:-none}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-}
      AI_APP_URL: ${AI_APP_URL:-}
      # Times are stored and exchanged in UTC; TZ only affects log timestamps.
      TZ: ${TZ:-Asia/Singapore}

volumes:
  db_data:
